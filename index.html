
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Finanças</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Minhas Finanças</h1>
        <p>Controle suas receitas e despesas</p>
    </header>

    <main>
        <section class="resumo">
            <div class="card">
                <h3>Saldo Total</h3>
                <h2 id="saldo">R$ 0,00</h2>
            </div>

            <div class="card receita">
                <h3>Receitas</h3>
                <h2 id="totalReceitas">R$ 0,00</h2>
            </div>

            <div class="card despesa">
                <h3>Despesas</h3>
                <h2 id="totalDespesas">R$ 0,00</h2>
            </div>
        </section>

        <section class="formulario">
            <h2>Nova Movimentação</h2>

            <form id="formMovimentacao">
                <input type="text" id="descricao"
                    placeholder="Descrição" required>

                <input type="number" id="valor"
                    placeholder="Valor (R$)"
                    min="0.01" step="0.01" required>

                <select id="tipo">
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>

                <button type="submit">Adicionar</button>
            </form>
        </section>

        <section class="historico">
            <h2>Histórico de Movimentações</h2>

            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="listaMovimentacoes"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
